name: Verify portfolio and demo engines
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:travel
      - run: npm run test:word-search
      - run: npm run test:avl
      - run: npm run test:careindex
      - run: npm run test:writing
      - run: npm ci && npm run build
        working-directory: trustmart-app
      - run: python -m pip install -r requirements.txt
        working-directory: trustmart-app
      - run: python -m unittest discover -s backend -p 'test_*.py'
        working-directory: trustmart-app
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
